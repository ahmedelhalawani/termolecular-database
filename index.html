<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <title>Termolecular Database</title>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: "Montserrat", sans-serif;
      background: #f3f1ed;
      color: #333;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background: #990000;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
    }

    header img.logo {
      height: 40px;
    }

    nav a {
      color: white;
      margin-left: 20px;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    h1 {
      color: #990000;
      font-size: 2em;
      margin-bottom: 20px;
    }

    main {
      padding: 20px;
    }

    table { 
      border-collapse: collapse; 
      width: 100%; 
      margin-top: 20px; 
    }

    th, td { 
      border: 1px solid #ccc; 
      padding: 6px 10px; 
    }

    th { 
      background: #f0f0f0; 
    }

    a { 
      color: #990000; 
      text-decoration: underline; 
    }

    button { 
      display: inline-block;
      padding: 6px 12px; 
      font-size: 0.825em; 
      margin-top: 10px; 
      cursor: pointer;
      background:  #990000;
      border: none;
      border-radius: 3px;
      color: white;
      font-family: "Montserrat", sans-serif;
    }

    .activeTab { 
      background: #b30000;
      color: white; 
    }

    input[type=range] {
      -webkit-appearance: none;
      width: 300px;
      height: 6px;
      background: #ddd;
      border-radius: 3px;
      outline: none;
      margin: 10px 0;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      background: #b30000;
      cursor: pointer;
      border-radius: 50%;
      border: none;
    }

    #searchBar {
      margin: 15px 0;
      padding: 8px;
      width: 300px;
      border: 1px solid #aaa;
      border-radius: 5px;
    }

    footer {
      text-align: center;
      background: #333;
      color: #ddd;
      padding: 15px;
      margin-top: auto;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <a href="landing.html">
        <img src="jpr_logo.png" alt="Logo" class="logo">
      </a>
    </div>
    <nav>
      <a href="landing.html">Home</a>
      <a href="contact.html">Contact</a>
      <a href="about.html">About</a>
      <a href="explanation.html">Explanation</a>
      <a href="index.html">Database</a>
    </nav>
  </header>

  <main>
    <h1>Termolecular Database</h1>

    <div>
      <button id="ionicBtn">Ionic Dataset</button>
      <button id="nonIonicBtn" class="activeTab">Non-Ionic Dataset</button>
    </div>

    <div>
      <button id="downloadBtn">Download CSV</button>
    </div>

    <div>
      <label for="tempSlider">Filter Temp./K ≤ <span id="tempValue"></span></label><br>
      <input type="range" id="tempSlider" min="0" max="100" value="100">
    </div>

    <div>
      <input type="text" id="searchBar" placeholder="Search reactions...">
    </div>

    <table id="csvTable"></table>
    <div id="graphContainer"></div>
  </main>

  <footer>
    © 2025 Termolecular Reaction Database | JPR Group
  </footer>

  <script>
    let allRows = [];
    let currentSet = "nonIonic"; // Default set

    const datasets = {
      ionic: { csv: "ionic.csv", notes: "ionic_notes.txt", sources: "ionic_sources.txt" },
      nonIonic: { csv: "nonionic.csv", notes: "nonionic_notes.txt", sources: "nonionic_sources.txt" }
    };

    const graphContainer = document.getElementById("graphContainer");
    const searchBar = document.getElementById("searchBar");
    const slider = document.getElementById("tempSlider");
    const tempValue = document.getElementById("tempValue");

    // Map Number → Section
    function getSectionFromNumber(num) {
      if (num >= 1 && num <= 161) return 1;
      if (num >= 162 && num <= 192) return 2;
      if (num >= 193 && num <= 281) return 3;
      if (num >= 282 && num <= 474) return 4;
      if (num >= 475 && num <= 562) return 5;
      if (num >= 563 && num <= 667) return 6;
      return null;
    }

    async function loadCSV(setKey) {
      currentSet = setKey;

      // Highlight active dataset
      document.getElementById("ionicBtn").classList.toggle("activeTab", setKey === "ionic");
      document.getElementById("nonIonicBtn").classList.toggle("activeTab", setKey === "nonIonic");

      // Reset search bar and filters
      searchBar.value = "";
      slider.value = slider.max;
      graphContainer.innerHTML = "";
      window.scrollTo({ top: 0, behavior: "smooth" });

      // Load CSV data
      const text = await (await fetch(datasets[setKey].csv)).text();
      const results = Papa.parse(text, { header: true, skipEmptyLines: true });
      allRows = results.data;

      const temps = allRows.map(r => parseFloat(r["Temp./K"])).filter(v => !isNaN(v));
      const minT = Math.min(...temps);
      const maxT = Math.max(...temps);

      slider.min = minT;
      slider.max = maxT;
      slider.value = maxT;
      tempValue.textContent = maxT;

      renderTable(allRows);
    }

    function normalizeChemical(text) {
      if (!text) return "";
      const subscripts = { "0": "₀", "1": "₁", "2": "₂", "3": "₃", "4": "₄", "5": "₅", "6": "₆", "7": "₇", "8": "₈", "9": "₉" };
      const superscripts = { "₀": "0", "₁": "1", "₂": "2", "₃": "3", "₄": "4", "₅": "5", "₆": "6", "₇": "7", "₈": "8", "₉": "9" };
      let normalized = text;
      for (const [num, sub] of Object.entries(subscripts)) normalized = normalized.replaceAll(num, sub);
      for (const [sub, num] of Object.entries(superscripts)) normalized = normalized.replaceAll(sub, num);
      return normalized;
    }

    function applyFilters() {
      const query = searchBar.value.toLowerCase().trim();
      tempValue.textContent = slider.value;

      const filtered = allRows.filter(r => {
        const tempOK = parseFloat(r["Temp./K"]) <= slider.value;
        if (!query) return tempOK;

        const reaction = (r.Reaction || "").toLowerCase();
        const normalizedQuery = normalizeChemical(query);
        const normalizedReaction = normalizeChemical(reaction);

        const searchOK = reaction.includes(query) ||
                         reaction.includes(normalizedQuery) ||
                         normalizedReaction.includes(query) ||
                         normalizedReaction.includes(normalizedQuery);

        return tempOK && searchOK;
      });

      renderTable(filtered);
    }

    function renderTable(data) {
      const table = document.getElementById("csvTable");
      table.innerHTML = "";

      if (data.length === 0) {
        table.innerHTML = "<tr><td>No results</td></tr>";
        return;
      }

      const headerRow = document.createElement("tr");
      Object.keys(data[0]).forEach(key => {
        const th = document.createElement("th");
        th.textContent = key;
        headerRow.appendChild(th);
      });
      table.appendChild(headerRow);

      data.forEach(row => {
        const tr = document.createElement("tr");
        const numberVal = parseInt(row["Number"]);
        const section = getSectionFromNumber(numberVal);

        Object.entries(row).forEach(([key, value]) => {
          const td = document.createElement("td");
          const lowerKey = key.toLowerCase();
          if ((lowerKey === "notes" || lowerKey === "reference" || lowerKey === "references") && value && section) {
            const targetPage = lowerKey === "notes" ? "notes.html" : "sources.html";
            td.innerHTML = `<a href="${targetPage}#section${section}">${value}</a>`;
          } else {
            td.textContent = value;
          }
          tr.appendChild(td);
        });
        table.appendChild(tr);
      });
    }

    document.getElementById("downloadBtn").addEventListener("click", () => {
      const link = document.createElement("a");
      link.href = datasets[currentSet].csv;
      link.download = datasets[currentSet].csv;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });

    slider.addEventListener("input", applyFilters);
    searchBar.addEventListener("input", applyFilters);

    document.getElementById("ionicBtn").addEventListener("click", () => loadCSV("ionic"));
    document.getElementById("nonIonicBtn").addEventListener("click", () => loadCSV("nonIonic"));

    // Default to non-ionic dataset
    loadCSV("nonIonic");
  </script>
</body>
</html>
