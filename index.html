<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">

  <title>Termolecular Database</title>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <script>
    window.MathJax = {
      tex: { inlineMath: [["$", "$"], ["\\(", "\\)"]] },
      svg: { fontCache: "global" }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

  <style>
    body {
      margin: 0;
      font-family: "Montserrat", sans-serif;
      background: #f3f1ed;
      color: #333;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background: #990000;
      color: white;
      display: flex;
      align-items: center;
      padding: 12px 24px;
      width: 110%;
      z-index: 1000;
    }
    header img.logo { height: 40px; }

    nav a {
      color: white;
      margin-left: 20px;
      text-decoration: none;
      font-weight: bold;
    }
    nav a:hover { text-decoration: underline; }

    main { padding: 20px; }

    h1 {
      color: #990000;
      font-size: 2em;
      margin-bottom: 20px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 6px 10px;
      vertical-align: top;
    }
    th { background: #f0f0f0; }

    a { color: #990000; text-decoration: underline; }

    button {
      padding: 6px 12px;
      font-size: 0.825em;
      margin-top: 10px;
      cursor: pointer;
      background: #990000;
      border: none;
      border-radius: 3px;
      color: white;
    }
    .activeTab { background: #b30000; }

    input[type=range] {
      width: 300px;
      height: 6px;
      background: #ddd;
      border-radius: 3px;
      margin: 10px 0;
    }

    #searchBar {
      margin: 15px 0;
      padding: 8px;
      width: 300px;
      border: 1px solid #aaa;
      border-radius: 5px;
    }

    footer {
      text-align: center;
      background: #333;
      color: #ddd;
      padding: 15px;
      width: 111%;
      margin-top: auto;
    }
  </style>
</head>

<body>
  <header>
    <a href="landing.html"><img src="jpr_logo.png" alt="Logo" class="logo"></a>
    <nav>
      <a href="landing.html">Home</a>
      <a href="contact.html">Contact</a>
      <a href="about.html">About</a>
      <a href="explanation.html">Explanation</a>
      <a href="index.html">Database</a>
    </nav>
  </header>

  <main>
    <h1>Termolecular Database</h1>

    <div>
      <button id="ionicBtn">Ionic Dataset</button>
      <button id="nonIonicBtn" class="activeTab">Non-Ionic Dataset</button>
      <button id="highPressureBtn">High Pressure Dataset</button>
    </div>

    <div>
      <button id="downloadBtn">Download CSV</button>
    </div>

    <div>
      <label>Filter Temp./K ≤ <span id="tempValue"></span></label><br />
      <input type="range" id="tempSlider" />
    </div>

    <div>
      <input type="text" id="searchBar" placeholder="Search reactions..." />
    </div>

    <table id="csvTable"></table>
    <div id="graphContainer"></div>
  </main>

  <footer>© 2025 Termolecular Reaction Database | JPR Group</footer>

  <script>
    let allRows = [];
    let currentSet = "nonIonic";

    const datasets = {
      ionic: { csv: "ionic.csv" },
      nonIonic: { csv: "nonionic.csv" },
      highPressure: { csv: "k_infinity.csv", latexCsv: "k_infinity_latex.csv" }
    };

    // Hide Reference_Text column (case-insensitive)
    const hiddenCols = ["reference_text"];

    const searchBar = document.getElementById("searchBar");
    const slider = document.getElementById("tempSlider");
    const tempValue = document.getElementById("tempValue");

    async function loadCSV(setKey) {
      currentSet = setKey;

      document.getElementById("ionicBtn").classList.toggle("activeTab", setKey === "ionic");
      document.getElementById("nonIonicBtn").classList.toggle("activeTab", setKey === "nonIonic");
      document.getElementById("highPressureBtn").classList.toggle("activeTab", setKey === "highPressure");

      // Reset filters / UI
      searchBar.value = "";

      const fileToLoad =
        setKey === "highPressure"
          ? datasets.highPressure.latexCsv
          : datasets[setKey].csv;

      const text = await (await fetch(fileToLoad)).text();
      const parsed = Papa.parse(text, { header: true, skipEmptyLines: true });
      allRows = parsed.data;

      const temps = allRows
        .map(r => parseFloat(r["Temp./K"]))
        .filter(v => !isNaN(v));

      if (temps.length) {
        slider.min = Math.min(...temps);
        slider.max = Math.max(...temps);
        slider.value = slider.max;
        tempValue.textContent = slider.value;
      } else {
        slider.min = 0;
        slider.max = 100;
        slider.value = 100;
        tempValue.textContent = slider.value;
      }

      renderTable(allRows, setKey === "highPressure");
    }

    function applyFilters() {
      if (currentSet === "highPressure") return;

      const q = searchBar.value.toLowerCase().trim();
      tempValue.textContent = slider.value;

      const filtered = allRows.filter(r => {
        const t = parseFloat(r["Temp./K"]);
        if (!isNaN(t) && t > slider.value) return false;
        return !q || (r.Reaction || "").toLowerCase().includes(q);
      });

      renderTable(filtered);
    }

    function renderTable(data, isHighPressure = false) {
      const table = document.getElementById("csvTable");
      table.innerHTML = "";

      if (!data.length) {
        table.innerHTML = "<tr><td>No results</td></tr>";
        return;
      }

      // ----- HEADER -----
      const headerRow = document.createElement("tr");
      Object.keys(data[0]).forEach(k => {
        if (hiddenCols.includes(k.toLowerCase())) return;
        const th = document.createElement("th");
        th.textContent = k;
        headerRow.appendChild(th);
      });
      table.appendChild(headerRow);

      // ----- ROWS -----
      data.forEach(row => {
        const tr = document.createElement("tr");

        Object.entries(row).forEach(([key, val]) => {
          if (hiddenCols.includes(key.toLowerCase())) return;

          const td = document.createElement("td");
          const lower = key.toLowerCase();
          const text = (val || "").toString().trim();

          // -----------------------------
          // HIGH PRESSURE: make Reference clickable
          // -----------------------------
          if (isHighPressure && lower === "reference" && text) {
            const a = document.createElement("a");
            // force to the single HP source entry
            a.href = `sources.html?tab=highpressure#1`;
            a.target = "_blank";
            a.textContent = text; // will show "1"
            td.appendChild(a);
          }

          // -----------------------------
          // NORMAL DATASETS: Reference/Notes links
          // -----------------------------
          else if (!isHighPressure && text) {
            const refs = text.split(",").map(r => r.trim()).filter(Boolean);

            // References → sources.html (dataset-aware)
            if (lower.includes("reference")) {
              const tab =
                currentSet === "ionic" ? "ionic" :
                "nonionic";

              refs.forEach((r, i) => {
                const a = document.createElement("a");
                a.href = `sources.html?tab=${tab}#${encodeURIComponent(r)}`;
                a.target = "_blank";
                a.textContent = r;
                td.appendChild(a);
                if (i < refs.length - 1) td.append(", ");
              });
            }

            // Notes → notes.html
            else if (lower === "notes" || lower.includes("note")) {
              refs.forEach((r, i) => {
                const a = document.createElement("a");
                // Force Ionic → single ionic note (tab jump)
                a.href = (currentSet === "ionic")
                  ? `notes.html#ionic`
                  : `notes.html#${encodeURIComponent(r)}`;
                a.target = "_blank";
                a.textContent = r;
                td.appendChild(a);
                if (i < refs.length - 1) td.append(", ");
              });
            }

            else {
              td.textContent = text;
            }
          }

          // High pressure latex formatting for k∞ if desired
          else if (isHighPressure && key === "k∞") {
            td.innerHTML = `$${text}$`;
          }

          else {
            td.textContent = text;
          }

          tr.appendChild(td);
        });

        table.appendChild(tr);
      });

      MathJax.typesetPromise();
    }

    document.getElementById("ionicBtn").onclick = () => loadCSV("ionic");
    document.getElementById("nonIonicBtn").onclick = () => loadCSV("nonIonic");
    document.getElementById("highPressureBtn").onclick = () => loadCSV("highPressure");

    searchBar.addEventListener("input", applyFilters);
    slider.addEventListener("input", applyFilters);

    document.getElementById("downloadBtn").onclick = () => {
      const a = document.createElement("a");
      a.href = datasets[currentSet].csv;
      a.download = datasets[currentSet].csv;
      a.click();
    };

    loadCSV("nonIonic");
  </script>
</body>
</html>
