<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

  <title>Termolecular Database</title>

  <!-- PapaParse -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <!-- MathJax for LaTeX rendering -->
  <script>
    window.MathJax = {
      tex: { inlineMath: [["$", "$"], ["\\(", "\\)"]] },
      svg: { fontCache: "global" }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

  <style>
    body {
      margin: 0;
      font-family: "Montserrat", sans-serif;
      background: #f3f1ed;
      color: #333;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      background: #990000;
      color: white;
      display: flex;
      align-items: center;
      padding: 12px 24px;
      width: 110%;
      z-index: 1000;
    }
    header img.logo { height: 40px; }
    nav a {
      color: white;
      margin-left: 20px;
      text-decoration: none;
      font-weight: bold;
    }
    nav a:hover { text-decoration: underline; }

    h1 {
      color: #990000;
      font-size: 2em;
      margin-bottom: 20px;
    }

    main { padding: 20px; }
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 6px 10px; }
    th { background: #f0f0f0; }

    a { color: #990000; text-decoration: underline; }

    button {
      padding: 6px 12px;
      font-size: 0.825em;
      margin-top: 10px;
      cursor: pointer;
      background: #990000;
      border: none;
      border-radius: 3px;
      color: white;
    }
    .activeTab { background: #b30000; }

    input[type=range] {
      width: 300px;
      height: 6px;
      background: #ddd;
      border-radius: 3px;
      margin: 10px 0;
    }

    #searchBar {
      margin: 15px 0;
      padding: 8px;
      width: 300px;
      border: 1px solid #aaa;
      border-radius: 5px;
    }

    footer {
      text-align: center;
      background: #333;
      color: #ddd;
      padding: 15px;
      margin-top: auto;
    }
  </style>
</head>

<body>
  <header>
    <a href="landing.html"><img src="jpr_logo.png" alt="Logo" class="logo"></a>
    <nav>
      <a href="landing.html">Home</a>
      <a href="contact.html">Contact</a>
      <a href="about.html">About</a>
      <a href="explanation.html">Explanation</a>
      <a href="index.html">Database</a>
    </nav>
  </header>

  <main>
    <h1>Termolecular Database</h1>

    <div>
      <button id="ionicBtn">Ionic Dataset</button>
      <button id="nonIonicBtn" class="activeTab">Non-Ionic Dataset</button>
      <button id="highPressureBtn">High Pressure Dataset</button>
    </div>

    <div><button id="downloadBtn">Download CSV</button></div>

    <div>
      <label for="tempSlider">Filter Temp./K ≤ <span id="tempValue"></span></label><br />
      <input type="range" id="tempSlider" min="0" max="100" value="100" />
    </div>

    <div>
      <input type="text" id="searchBar" placeholder="Search reactions..." />
    </div>

    <table id="csvTable"></table>
    <div id="graphContainer"></div>
  </main>

  <footer>© 2025 Termolecular Reaction Database | JPR Group</footer>

  <script>
    let allRows = [];
    let currentSet = "nonIonic";

    const datasets = {
      ionic: { csv: "ionic.csv" },
      nonIonic: { csv: "nonionic.csv" },

      /* 🔥 High-pressure now loads LaTeX version but downloads the old file */
      highPressure: {
        csv: "k_infinity.csv",          // download file
        latexCsv: "k_infinity_latex.csv" // on-screen table file
      }
    };

    const searchBar = document.getElementById("searchBar");
    const slider = document.getElementById("tempSlider");
    const tempValue = document.getElementById("tempValue");
    const graphContainer = document.getElementById("graphContainer");

    function getSectionFromNumber(num) {
      if (num >= 1 && num <= 161) return 1;
      if (num >= 162 && num <= 192) return 2;
      if (num >= 193 && num <= 280) return 3;
      if (num >= 281 && num <= 468) return 4;
      if (num >= 469 && num <= 553) return 5;
      if (num >= 554 && num <= 654) return 6;
      return null;
    }

    async function loadCSV(setKey) {
      currentSet = setKey;

      document.getElementById("ionicBtn").classList.toggle("activeTab", setKey === "ionic");
      document.getElementById("nonIonicBtn").classList.toggle("activeTab", setKey === "nonIonic");
      document.getElementById("highPressureBtn").classList.toggle("activeTab", setKey === "highPressure");

      searchBar.value = "";
      slider.value = slider.max;
      graphContainer.innerHTML = "";
      window.scrollTo({ top: 0, behavior: "smooth" });

      const fileToLoad =
        setKey === "highPressure" ? datasets.highPressure.latexCsv : datasets[setKey].csv;

      const text = await (await fetch(fileToLoad)).text();
      const parsed = Papa.parse(text, { header: true, skipEmptyLines: true });
      allRows = parsed.data;

      const temps = allRows.map(r => parseFloat(r["Temp./K"])).filter(v => !isNaN(v));
      const minT = Math.min(...temps), maxT = Math.max(...temps);
      slider.min = minT;
      slider.max = maxT;
      slider.value = maxT;
      tempValue.textContent = maxT;

      renderTable(allRows, setKey === "highPressure");
    }

    function normalizeChemical(text) {
      if (!text) return "";
      const subs = { "0": "₀", "1": "₁", "2": "₂", "3": "₃", "4": "₄", "5": "₅", "6": "₆", "7": "₇", "8": "₈", "9": "₉" };
      let t = text;
      for (const [n, s] of Object.entries(subs)) t = t.replaceAll(n, s);
      return t;
    }

    function applyFilters() {
      if (currentSet === "highPressure") return; // HP has no filtering

      const query = searchBar.value.toLowerCase().trim();
      tempValue.textContent = slider.value;

      const filtered = allRows.filter(r => {
        const tempOK = parseFloat(r["Temp./K"]) <= slider.value;
        if (!query) return tempOK;

        const reaction = (r.Reaction || "").toLowerCase();
        const normQuery = normalizeChemical(query);
        const normReaction = normalizeChemical(reaction);

        return (
          reaction.includes(query) ||
          reaction.includes(normQuery) ||
          normReaction.includes(query) ||
          normReaction.includes(normQuery)
        ) && tempOK;
      });

      renderTable(filtered);
    }

    function renderTable(data, isHighPressure = false) {
      const table = document.getElementById("csvTable");
      table.innerHTML = "";

      if (!data.length) {
        table.innerHTML = "<tr><td>No results</td></tr>";
        return;
      }

      const hiddenCols = ["reference_text"];

      // Header
      const headerRow = document.createElement("tr");
      Object.keys(data[0]).forEach(k => {
        if (hiddenCols.includes(k.toLowerCase())) return;
        const th = document.createElement("th");
        th.textContent = k;
        headerRow.appendChild(th);
      });
      table.appendChild(headerRow);

      // Rows
      data.forEach(row => {
        const tr = document.createElement("tr");
        const num = parseInt(row["Number"]);
        const section = currentSet === "ionic" ? null : getSectionFromNumber(num);

        Object.entries(row).forEach(([key, val]) => {
          if (hiddenCols.includes(key.toLowerCase())) return;

          const td = document.createElement("td");
          const lower = key.toLowerCase();

          if (!isHighPressure &&
              (lower === "notes" || lower.includes("reference")) &&
              val) {

            let link = "";
            if (lower.includes("reference")) {
              if (currentSet === "ionic") link = `sources.html?tab=ionic`;
              else if (currentSet === "highPressure") link = `sources.html#highpressure`;
              else link = `sources.html#section${section}`;
            }
            if (lower === "notes") {
              if (currentSet === "ionic") link = `notes.html#ionic`;
              else link = `notes.html#section${section}`;
            }
            td.innerHTML = `<a href="${link}" target="_blank">${val}</a>`;
          }

          /* 🔥 High-pressure LaTeX rendering for k∞ */
          else if (isHighPressure && (key === "k∞" || key.toLowerCase() === "k_infinity")) {
            td.innerHTML = `$${val}$`;
          }

          else {
            td.textContent = val;
          }

          tr.appendChild(td);
        });

        table.appendChild(tr);
      });

      /* 🔥 Re-render LaTeX */
      MathJax.typesetPromise();
    }

    document.getElementById("ionicBtn").addEventListener("click", () => loadCSV("ionic"));
    document.getElementById("nonIonicBtn").addEventListener("click", () => loadCSV("nonIonic"));
    document.getElementById("highPressureBtn").addEventListener("click", () => loadCSV("highPressure"));

    searchBar.addEventListener("input", applyFilters);
    slider.addEventListener("input", applyFilters);

    /* 🔥 Download original CSV (not LaTeX) */
    document.getElementById("downloadBtn").addEventListener("click", () => {
      const link = document.createElement("a");
      link.href = datasets[currentSet].csv;
      link.download = datasets[currentSet].csv;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });

    loadCSV("nonIonic");
  </script>
</body>
</html>
